# Panel view "Users › Statistics" (site/plugins/panel-stats), native fields whose queries run against the site
title: User Statistics
columns:
  users:
    width: 1/1
    fields:
      usersActions:
        label: Users
        type: buttons
        buttons:
          - text: Inactive accounts
            icon: trash
            dialog: inactive-accounts
      users:
        label: false
        type: stats
        # Available size options: small, medium, large, huge. Default is large
        size: huge
        reports:
          - label: Total Users
            value: "{{ site.totalUsers }}"
            icon: users
          - label: Free Users
            value: "{{ site.freeUsers }}"
            info: "{{ site.freeUsersPercentage }}"
            icon: user
          - label: Paid Users
            value: "{{ site.paidUsers }}"
            info: "{{ site.paidUsersPercentage }}"
            icon: money
            theme: positive
          - label: Inactive Users
            value: "{{ site.inactiveUsers }}"
            info: "{{ site.inactiveUsersInfo }}"
            icon: clock
            theme: "{{ site.inactiveUsersTheme }}"
            # same dialog as the "Inactive accounts" button
            dialog: inactive-accounts
  usersLeft:
    width: 1/2
    fields:
      userMix:
        label: User Mix
        type: stats
        size: small
        reports: site.chartReports('userMixChart', 'users')
      activation:
        label: Activation
        type: stats
        size: small
        reports: site.chartReports('activationChart', 'check')
  usersRight:
    width: 1/2
    fields:
      activity:
        label: Last Activity
        type: stats
        size: small
        reports: site.chartReports('activityChart', 'clock')
