# Panel view "Bookmarks" (site/plugins/panel-stats), native fields whose queries run against the site
title: Bookmarks
columns:
  bookmarks:
    width: 1/1
    fields:
      bookmarks:
        label: Bookmarks
        type: stats
        size: large
        reports:
          - label: Total Bookmarks
            value: "{{ site.totalBookmarks }}"
            info: "{{ site.bookmarksPerUser }}"
            icon: bookmark
          # bookmark figures only: user shares (with bookmarks, using tags) are in the activation stats
          - label: Tagged Bookmarks
            value: "{{ site.taggedBookmarks }}"
            info: "{{ site.taggedBookmarksInfo }}"
            icon: tag
          - label: Different Tags
            value: "{{ site.totalTags }}"
            info: case-insensitive
            icon: list-bullet
  bookmarksLeft:
    width: 1/2
    fields:
      topTags:
        label: Top Tags
        type: stats
        size: small
        reports: site.chartReports('topTagsChart', 'tag', 'No tags yet')
  bookmarksRight:
    width: 1/2
    fields:
      topBrands:
        label: Most Used Logos
        type: stats
        size: small
        reports: site.chartReports('topBrandsChart', 'image', 'No logos in use yet')

  # ---------- Brands ----------
  brands:
    width: 1/1
    fields:
      brands:
        label: Brands
        type: stats
        size: large
        reports:
          - label: Brand Coverage
            value: "{{ site.brandCoveragePercentage }}"
            info: "{{ site.brandCoverageInfo }}"
            icon: chart
            theme: "{{ site.brandCoverageTheme }}"
          - label: Bookmarks Without Brands
            value: "{{ site.bookmarksWithoutBrands }}"
            info: Listed below
            icon: alert
            theme: "{{ site.bookmarksWithoutBrandsTheme }}"
          - label: Available Brands
            value: "{{ site.totalAvailableBrands }}"
            info: "{{ site.brandsInUseInfo }}"
            icon: image
  brandsLeft:
    width: 1/2
    fields:
      brandCoverage:
        label: Brand Coverage
        type: stats
        size: small
        reports: site.chartReports('brandCoverageChart', 'image')
  brandsRight:
    width: 1/2
    fields:
      missingBrandsActions:
        label: Missing Brand Logos
        type: buttons
        buttons:
          - text: Copy list
            icon: copy
            dialog: missing-brands
      missingBrands:
        label: false
        type: stats
        size: small
        reports: site.missingBrandsReports
