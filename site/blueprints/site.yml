title: Site
buttons:
  - open
  - preview
columns:
  # ---------- At a glance: details in "Bookmarks" and "Users › Statistics" (site/plugins/panel-stats) ----------
  overview:
    width: 1/1
    sections:
      Overview:
        type: stats
        size: large
        reports:
          - label: Users
            value: "{{ site.totalUsers }}"
            info: "{{ site.paidUsers }} paid"
            icon: users
            link: "{{ kirby.url('panel') }}/user-statistics"
          - label: Bookmarks
            value: "{{ site.totalBookmarks }}"
            info: "{{ site.bookmarksPerUser }}"
            icon: bookmark
            link: "{{ kirby.url('panel') }}/bookmarks"
          - label: Missing Logos
            value: "{{ site.bookmarksWithoutBrands }}"
            info: "{{ site.brandCoverageInfo }} with logo"
            icon: image
            theme: "{{ site.bookmarksWithoutBrandsTheme }}"
            link: "{{ kirby.url('panel') }}/bookmarks"
  # ---------- Legal pages: the only pages with editable text, technical pages (login, register, ...) stay hidden ----------
  legal:
    width: 1/1
    sections:
      Legal:
        type: pages
        headline: Legal Pages
        query: site.children.filterBy('slug', 'in', ['imprint', 'privacy', 'terms'])
        status: all
        create: false
        sortable: false
        layout: list
        empty: No legal pages yet
